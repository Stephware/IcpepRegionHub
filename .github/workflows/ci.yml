name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: API end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
